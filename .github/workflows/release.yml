name: Package ForeverProfessions release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shipped Lua and addon manifest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          while IFS= read -r source; do
            case "$source" in
              *.lua)
                test -f "$source" || { echo "Missing addon source: $source" >&2; exit 1; }
                luac5.1 -p "$source"
                ;;
            esac
          done < <(tr -d '\r' < ForeverProfessions.toc)

      - name: Read addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F': ' '/^## Version:/ {print $2; exit}' ForeverProfessions.toc | tr -d '\r')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid ## Version in ForeverProfessions.toc' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=ForeverProfessions-$VERSION-forever.zip" >> "$GITHUB_OUTPUT"

      - name: Check whether version already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build WowUp-compatible zip
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/ForeverProfessions
          cp *.toc *.lua README.md CHANGELOG.md dist/ForeverProfessions/
          cd dist
          zip -r "../${{ steps.version.outputs.asset }}" ForeverProfessions

      - name: Publish GitHub release
        if: steps.existing.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ForeverProfessions ${{ steps.version.outputs.version }}
          body: |
            Automatic gather recording now pairs player mining, herbalism, and fishing casts with loot events. Gathered locations are stored as observed nodes, with manual marking retained as a fallback. Live-client verification is still needed for exact event behavior.
          files: ${{ steps.version.outputs.asset }}
          fail_on_unmatched_files: true
